# Squirrel-RIFE pre-commit 配置
# 安装: pip install pre-commit && pre-commit install
# 手动运行: pre-commit run --all-files
repos:
  # 通用: 尾随空白、文件末尾换行、YAML/大文件检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=10240]   # 10 MB 上限，防止误提交模型权重/视频
      - id: check-merge-conflict
      - id: check-case-conflict  # Windows 大小写冲突检测

  # Python 格式化: ruff format（兼容 black，但更快）
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.8
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # Python 语法检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
      - id: check-builtin-literals

# 跳过 Tauri 生成的 schema 文件，避免 pre-commit 反复检查自动生成产物
exclude: ^frontend/src-tauri/gen/schemas/.*\.json$

# ruff 全局配置（pre-commit 和 CLI 共享）
ci:
  autofix_commit_msg: "style: pre-commit auto-fix"
