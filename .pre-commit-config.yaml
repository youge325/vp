# pre-commit 配置
# 安装: pip install pre-commit && pre-commit install
# 手动运行: pre-commit run --all-files
repos:
  # 通用: 尾随空白、文件末尾换行、YAML/大文件检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=10240]   # 10 MB 上限，防止误提交模型权重/视频
      - id: check-merge-conflict
      - id: check-case-conflict  # Windows 大小写冲突检测

  # Python 格式化: ruff format（兼容 black，但更快）
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # Python 语法检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
      - id: check-builtin-literals

  # 中立 JSON Schema 是跨语言契约的唯一事实源。
  - repo: local
    hooks:
      - id: check-generated-contracts
        name: 中立契约校验与生成物 freshness
        entry: python scripts/generate_contracts.py --check
        language: system
        pass_filenames: false
        files: '^(contracts/.*\.json|backend/app/generated/(?:bootstrap_constants|contracts|protocol_constants|stage_worker_contracts)\.py|frontend/src/types/generated/contracts\.ts|frontend/src/types/protocol/events\.ts|frontend/src/lib/ipc/contract\.ts|frontend/src-tauri/src/generated/(?:backend_oneshot|backend_task_envelope|ipc_manifest|mod|task_events|persistence_versions)\.rs|frontend/src-tauri/src/models/generated_error_codes\.rs|scripts/(?:generate_contracts\.py|requirements-quality\.txt))$'
      - id: check-architecture-contracts
        name: 前后端架构边界与命令面一致性
        entry: python scripts/check_architecture_contracts.py
        language: system
        pass_filenames: false
        files: '^(AGENTS\.md|README\.md|ruff\.toml|docs/.*\.md|\.github/workflows/.+\.ya?ml|backend/(?:app|tests|tests_full_e2e)/.*\.py|backend/requirements(?:-dev)?\.txt|backend/export_all_rife_onnx\.py|frontend/(?:src|tests)/.+\.(ts|vue)|frontend/(?:package(?:-lock)?\.json|vitest\.config\.ts|vite\.config\.ts|wdio\.conf\.ts|tsconfig(?:\.[^.]+)?\.json|knip(?:\.production)?\.config\.mjs|\.jscpd\.json|scripts/.+\.mjs)|frontend/src-tauri/(?:Cargo\.toml|build\.rs|src/.+\.rs|permissions/default\.toml)|scripts/.+\.(?:py|ps1)|scripts/requirements-quality\.txt)$'
      - id: check-frontend-static-quality
        name: 前端静态质量与全仓重复检测
        entry: npm --prefix frontend run check
        language: system
        pass_filenames: false
        files: '^frontend/(?:src|tests|scripts|packages)/.+\.(?:ts|tsx|vue|js|mjs|cjs)$|^frontend/(?:package(?:-lock)?\.json|eslint\.config\.js|knip(?:\.production)?\.config\.mjs|\.jscpd\.json|tsconfig.*\.json|(?:vite|vitest|wdio)\.config\.ts)$|^contracts/.*\.json$|^backend/(?:app|tests|tests_full_e2e)/.*\.py$|^backend/export_all_rife_onnx\.py$'
      - id: check-python-dead-code
        name: Python dead-code zero-findings
        entry: python scripts/check_python_dead_code.py
        language: system
        pass_filenames: false
        files: '^(?:backend/(?:app|tests|tests_full_e2e)/.*|backend/export_all_rife_onnx|scripts/.+)\.py$'

# Tauri 自身生成的 ACL schema 不是应用层中立契约。
exclude: ^frontend/src-tauri/gen/schemas/.*\.json$

# ruff 全局配置（pre-commit 和 CLI 共享）
ci:
  autofix_commit_msg: "style: pre-commit auto-fix"
