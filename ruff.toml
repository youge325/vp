# ruff 配置

line-length = 120
target-version = "py312"

[lint]
# pycodestyle 核心、pyflakes 与生产代码未使用参数检查
select = ["E4", "E7", "E9", "F", "ARG"]

# 这两个可直接执行的重型 RIFE 验证脚本需先注入 backend 路径。
# 其他测试不允许用宽泛规则隐藏未使用 import。
per-file-ignores."backend/tests/test_algorithms/test_rife_all_models.py" = ["E402", "F841"]
per-file-ignores."backend/tests/test_weight_loading.py" = ["E402"]
per-file-ignores."backend/app/algorithms/paddle/paddlegan_vsr/vendor/**" = ["ARG"]

[format]
quote-style = "double"
indent-style = "space"
