name: Linux ARC Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: vp-linux-arc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Inspect runner
        run: |
          uname -a
          whoami
          pwd
          ls -la

      - name: Verify checkout
        run: test -f README.md
