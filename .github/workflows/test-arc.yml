name: Linux Test Frontend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-frontend-arc:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    runs-on: vp-linux-arc
    env:
      CARGO_TARGET_DIR: /tmp/vp-cargo-target
      VP_FFMPEG_PATH: /usr/bin/ffmpeg
      VP_FFPROBE_PATH: /usr/bin/ffprobe
      VP_RIFE_MODEL_DIR: /opt/vp/models
      VP_PYTHON_EXECUTABLE: /opt/vp/venv/bin/python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify ARC runtime
        run: |
          node --version
          npm --version
          python --version
          rustc --version
          cargo --version
          ffmpeg -version | head -n 1

      - name: Install frontend dependencies
        run: |
          npm ci
          npm install --include=optional --no-audit --no-fund
        working-directory: frontend

      - name: Install contract quality tools
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-quality.txt

      - name: Neutral contract generation check
        run: python scripts/generate_contracts.py --check

      - name: Run Rust tests
        run: |
          mkdir -p ../dist
          cargo test --lib --quiet
        working-directory: frontend/src-tauri

      - name: Lint Rust targets
        run: cargo clippy --all-targets -- -D warnings
        working-directory: frontend/src-tauri

      - name: Run frontend tests with coverage
        run: npm run test -- --coverage
        working-directory: frontend

      - name: Type-check frontend (vue-tsc + vite build)
        run: npm run build
        working-directory: frontend

      - name: Frontend static quality gates
        run: npm run check
        working-directory: frontend

      - name: Python dead-code gate
        run: python -m vulture backend/app backend/tests backend/tests_full_e2e backend/export_all_rife_onnx.py scripts backend/vulture_whitelist.py --min-confidence 60 --exclude "backend/app/generated/,backend/app/algorithms/paddle/paddlegan_vsr/vendor/,backend/app/algorithms/pytorch/rife/ifnet_v4_"

      - name: Architecture contracts check
        run: python scripts/check_architecture_contracts.py
