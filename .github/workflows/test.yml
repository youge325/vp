name: Windows Test Frontend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - 'contracts/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - 'ruff.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - 'contracts/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - 'ruff.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/test.yml'

permissions:
  contents: read

jobs:
  test-frontend:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TARGET_DIR: D:\ci-cache\cargo-target
      CARGO_HOME: D:\ci-cache\cargo-home

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install frontend dependencies (with Vite cache restore)
        run: |
          $viteCache = "node_modules/.vite"
          $localViteCache = "D:/ci-cache/vite-cache"
          if (Test-Path $viteCache) {
            New-Item -ItemType Directory -Force -Path $localViteCache | Out-Null
            robocopy $viteCache $localViteCache /MIR /R:1 /W:1 /MT:8 | Out-Null
          }
          npm ci
          if (Test-Path $localViteCache) {
            New-Item -ItemType Directory -Force -Path $viteCache | Out-Null
            robocopy $localViteCache $viteCache /MIR /R:1 /W:1 /MT:8 | Out-Null
          }
        working-directory: frontend

      - name: Install contract quality tools
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-quality.txt

      # ``tauri::generate_context!()`` validates ``frontendDist`` at compile
      # time, so an empty placeholder satisfies the macro before the frontend
      # build exists.
      - name: Neutral contract generation check
        run: python scripts/generate_contracts.py --check

      - name: Run Rust tests
        run: |
          New-Item -ItemType Directory -Force -Path "../dist" | Out-Null
          cargo test --lib --quiet
        working-directory: frontend/src-tauri

      - name: Lint Rust targets
        run: cargo clippy --all-targets -- -D warnings
        working-directory: frontend/src-tauri

      - name: Run frontend tests with coverage
        run: npm run test -- --coverage
        working-directory: frontend

      - name: Type-check frontend (vue-tsc + vite build)
        run: npm run build
        working-directory: frontend

      - name: Frontend static quality gates
        run: npm run check
        working-directory: frontend

      - name: Python dead-code gate
        run: python -m vulture backend/app backend/tests backend/tests_full_e2e backend/export_all_rife_onnx.py scripts backend/vulture_whitelist.py --min-confidence 60 --exclude "backend/app/generated/,backend/app/algorithms/paddle/paddlegan_vsr/vendor/,backend/app/algorithms/pytorch/rife/ifnet_v4_"

      - name: Architecture contracts check
        run: python scripts/check_architecture_contracts.py
