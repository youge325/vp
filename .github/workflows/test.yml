name: Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - '.github/workflows/build.yml'
      - '.github/workflows/release.yml'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main, master, develop]
    paths-ignore:
      - '.github/workflows/build.yml'
      - '.github/workflows/release.yml'
      - 'docs/**'
      - '**/*.md'

jobs:
  test-frontend:
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm run test
        working-directory: frontend

  test-backend-pytorch:
    runs-on: [self-hosted, windows]
    env:
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup CI runtime environment
        run: ./scripts/setup-ci-runtime-env.ps1

      - name: Run PyTorch backend tests
        run: python -m pytest tests --ignore=tests/test_algorithms/test_tensor_backend_paddle.py -q
        working-directory: backend

  test-backend-paddle:
    runs-on: [self-hosted, windows]
    env:
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup CI runtime environment
        run: ./scripts/setup-ci-runtime-env.ps1

      - name: Run Paddle backend tests
        run: python -m pytest tests/test_algorithms/test_tensor_backend_paddle.py -q
        working-directory: backend
