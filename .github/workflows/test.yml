name: Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test-frontend:
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm run test
        working-directory: frontend

  test-backend-pytorch:
    runs-on: [self-hosted, windows]
    env:
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup CI runtime environment
        run: ./scripts/setup-ci-runtime-env.ps1

      - name: Run PyTorch backend tests
        run: python -m pytest tests -k "not (PaddleBackend or test_get_paddle)" -q
        working-directory: backend

  test-backend-paddle:
    runs-on: [self-hosted, windows]
    env:
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup CI runtime environment
        run: ./scripts/setup-ci-runtime-env.ps1

      - name: Run Paddle backend tests
        run: python -m pytest tests/test_algorithms/test_tensor_backend.py -k "PaddleBackend or test_get_paddle" -q
        working-directory: backend
