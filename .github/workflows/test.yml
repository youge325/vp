name: Test Frontend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/app/**'
      - 'frontend/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'backend/app/**'
      - 'frontend/**'
      - '.github/workflows/test.yml'

jobs:
  test-frontend:
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # Phase D.5.2 — generated TS types are .gitignore'd; ts-rs only
      # produces them when ``cargo test`` runs. Without this step, a PR
      # that renames or adds a Rust IPC type would still pass ``npm run
      # test`` (vitest only treats type imports as elidable), and the
      # drift would only surface during the much-later Build job.
      #
      # NOTE: ``tauri::generate_context!()`` (which the lib pulls in via
      # ``tauri::Builder::default().run(generate_context!())``) eagerly
      # validates the configured ``frontendDist`` (``../dist``) at compile
      # time. We haven't actually built the frontend yet, so create an
      # empty placeholder directory just to satisfy the macro — the
      # contents don't matter for ``cargo test --lib``. Same trick the
      # Build workflow uses.
      - name: Regenerate TypeScript types from Rust (ts-rs)
        run: |
          New-Item -ItemType Directory -Force -Path "../dist" | Out-Null
          cargo test --lib --quiet
        working-directory: frontend/src-tauri

      - name: Run frontend tests
        run: npm run test
        working-directory: frontend

      # ``npm run build`` runs ``vue-tsc`` first, which is the strictest
      # type check we have. Putting it after ts-rs regeneration means a
      # mismatched Rust ↔ TS schema will fail here in the CI rather than
      # in the Build workflow that runs much later.
      - name: Type-check frontend (vue-tsc + vite build)
        run: npm run build
        working-directory: frontend

      # Phase D.5.1 — TaskErrorCode 三层一致性 already runs as a
      # pre-commit hook; surface the same check in CI so PR authors
      # who skip hooks (--no-verify) can't sneak drift in.
      - name: TaskErrorCode three-layer consistency check
        run: python scripts/check_error_code_drift.py
