name: Linux End-to-End Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-smoke-arc:
    runs-on: vp-linux-arc
    env:
      PYTHONIOENCODING: utf-8
      VP_FFMPEG_PATH: /usr/bin/ffmpeg
      VP_FFPROBE_PATH: /usr/bin/ffprobe
      VP_RIFE_MODEL_DIR: /opt/vp/models
      VP_PYTHON_EXECUTABLE: /opt/vp/venv/bin/python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate shared E2E fixture
        run: node frontend/scripts/generate-e2e-fixture.mjs "${RUNNER_TEMP}/vp-e2e-test.mp4"

      - name: Run CLI e2e smoke tests
        run: python -m pytest backend/tests/test_integration/test_cli_process_e2e.py -v
        env:
          VP_E2E_INPUT: ${{ runner.temp }}/vp-e2e-test.mp4
          VP_E2E_OUTPUT_DIR: ${{ runner.temp }}/vp-e2e-output

  e2e-ui-arc:
    runs-on: vp-linux-arc
    env:
      CARGO_TARGET_DIR: /tmp/vp-cargo-target
      PYTHONIOENCODING: utf-8
      VP_FFMPEG_PATH: /usr/bin/ffmpeg
      VP_FFPROBE_PATH: /usr/bin/ffprobe
      VP_RIFE_MODEL_DIR: /opt/vp/models
      VP_PYTHON_EXECUTABLE: /opt/vp/venv/bin/python
      VP_BACKEND_DIR: ${{ github.workspace }}/backend
      VP_E2E_CACHE_DIR: /tmp/vp-e2e-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install frontend dependencies
        run: |
          npm ci
          npm install --include=optional --no-audit --no-fund
        working-directory: frontend

      - name: Regenerate TypeScript types from Rust
        run: |
          mkdir -p ../dist
          cargo test --lib --quiet
        working-directory: frontend/src-tauri

      - name: Build coverage-instrumented Tauri app
        run: npm run tauri build -- --no-bundle
        working-directory: frontend
        env:
          CI: true
          E2E_COVERAGE: 1

      - name: Verify Tauri WebDriver runtime
        run: |
          tauri-driver --help | head -n 5
          if command -v WebKitWebDriver >/dev/null 2>&1; then
            WebKitWebDriver --version || WebKitWebDriver --help | head -n 5
          elif command -v webkit2gtk-driver >/dev/null 2>&1; then
            webkit2gtk-driver --version || webkit2gtk-driver --help | head -n 5
          else
            echo "WebKitGTK WebDriver binary was not found" >&2
            exit 1
          fi

      - name: Generate shared E2E fixture
        run: node frontend/scripts/generate-e2e-fixture.mjs "${RUNNER_TEMP}/vp-e2e-test.mp4"

      - name: Run complete WebDriverIO E2E suite
        timeout-minutes: 15
        run: xvfb-run -a npm run e2e
        working-directory: frontend
        env:
          E2E_COVERAGE: 1
          VP_TAURI_EXE_PATH: /tmp/vp-cargo-target/release/vp-workbench
          VP_E2E_INPUT: ${{ runner.temp }}/vp-e2e-test.mp4
          VP_E2E_OUTPUT_DIR: ${{ runner.temp }}/vp-e2e-output
          VP_RUNTIME_ROOT: ${{ github.workspace }}/frontend/src-tauri/resources/runtime

      - name: Generate E2E coverage report
        run: |
          coverage_count="$(find .nyc_output -maxdepth 1 -type f -name '*.json' | wc -l)"
          test "$coverage_count" -gt 0 || { echo "E2E coverage data was not written to frontend/.nyc_output" >&2; exit 1; }
          test "$coverage_count" -le 10 || { echo "Expected at most 10 session coverage files, found $coverage_count" >&2; exit 1; }
          npx nyc report --reporter=text --reporter=html
        working-directory: frontend
