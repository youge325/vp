name: End-to-End Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/app/**'
      - 'frontend/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'backend/app/**'
      - 'frontend/**'
      - '.github/workflows/e2e.yml'

jobs:
  e2e-smoke:
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: Setup CI runtime environment
        run: ./scripts/setup-ci-runtime-env.ps1

      - name: Generate synthetic test video
        run: |
          ffmpeg -f lavfi -i testsrc=duration=1:size=1280x720:rate=30 `
                 -f lavfi -i sine=frequency=1000:duration=1 `
                 -pix_fmt yuv420p -c:v libx264 -c:a aac `
                 "${{ runner.temp }}\vp-e2e-test.mp4" -y

      - name: Run CLI e2e smoke tests
        run: python -m pytest backend/tests/test_integration/test_cli_process_e2e.py -v
        env:
          VP_E2E_INPUT: ${{ runner.temp }}\vp-e2e-test.mp4
          VP_E2E_OUTPUT_DIR: ${{ runner.temp }}\vp-e2e-output

  e2e-ui:
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TARGET_DIR: D:\ci-cache\cargo-target
      CARGO_HOME: D:\ci-cache\cargo-home
    steps:
      - uses: actions/checkout@v6

      - name: Install frontend dependencies (with Vite cache restore)
        run: |
          $viteCache = "node_modules/.vite"
          $localViteCache = "D:/ci-cache/vite-cache"
          if (Test-Path $viteCache) {
            New-Item -ItemType Directory -Force -Path $localViteCache | Out-Null
            robocopy $viteCache $localViteCache /MIR /R:1 /W:1 /MT:8 | Out-Null
          }
          npm ci
          if (Test-Path $localViteCache) {
            New-Item -ItemType Directory -Force -Path $viteCache | Out-Null
            robocopy $localViteCache $viteCache /MIR /R:1 /W:1 /MT:8 | Out-Null
          }
        working-directory: frontend

      - name: Regenerate TypeScript types from Rust (ts-rs)
        run: |
          New-Item -ItemType Directory -Force -Path "../dist" | Out-Null
          cargo test --lib --quiet
        working-directory: frontend/src-tauri

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: frontend

      - name: Generate synthetic test video
        run: |
          ffmpeg -f lavfi -i testsrc=duration=1:size=1280x720:rate=30 `
                 -f lavfi -i sine=frequency=1000:duration=1 `
                 -pix_fmt yuv420p -c:v libx264 -c:a aac `
                 "${{ runner.temp }}\vp-e2e-test.mp4" -y

      - name: Build Tauri app (release)
        run: npm run tauri build -- --no-bundle
        working-directory: frontend
        env:
          CI: true

      - name: Ensure Tauri executable is in expected location for Playwright
        run: |
          $expectedDir = "frontend/src-tauri/target/release"
          $expectedExe = "$expectedDir/vp-workbench.exe"
          if (-not (Test-Path -LiteralPath $expectedExe)) {
            New-Item -ItemType Directory -Force -Path $expectedDir | Out-Null
            Copy-Item -LiteralPath "$env:CARGO_TARGET_DIR/release/vp-workbench.exe" -Destination $expectedExe -Force
            Write-Host "Copied executable to expected location: $expectedExe"
          }

      - name: Run Playwright e2e tests
        run: npx playwright test e2e/ --reporter=list
        working-directory: frontend
        env:
          VP_E2E_INPUT: ${{ runner.temp }}\vp-e2e-test.mp4
          VP_E2E_OUTPUT_DIR: ${{ runner.temp }}\vp-e2e-output
          VP_BACKEND_DIR: ${{ github.workspace }}\backend
          VP_FFMPEG_PATH: D:\ffmpeg-2025-08-11-git-3542260376-full_build\bin\ffmpeg.exe
          VP_FFPROBE_PATH: D:\ffmpeg-2025-08-11-git-3542260376-full_build\bin\ffprobe.exe
          VP_RIFE_MODEL_DIR: D:\tmp\vp-e2e-models
