name: Windows End-to-End Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/app/**'
      - 'contracts/**'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'backend/app/**'
      - 'contracts/**'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

jobs:
  e2e-smoke:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: Setup CI runtime environment
        run: ./scripts/setup-ci-runtime-env.ps1

      - name: Generate shared E2E fixture
        run: node frontend/scripts/generate-e2e-fixture.mjs "${{ runner.temp }}\vp-e2e-test.mp4"

      - name: Run CLI e2e smoke tests
        run: python -m pytest backend/tests/test_integration/test_cli_process_e2e.py -v
        env:
          VP_E2E_INPUT: ${{ runner.temp }}\vp-e2e-test.mp4
          VP_E2E_OUTPUT_DIR: ${{ runner.temp }}\vp-e2e-output

  e2e-ui:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TARGET_DIR: D:\ci-cache\cargo-target
      CARGO_HOME: D:\ci-cache\cargo-home
      VP_E2E_CACHE_DIR: D:\ci-cache\vp-e2e
    steps:
      - uses: actions/checkout@v6

      - name: Setup CI runtime environment
        run: ./scripts/setup-ci-runtime-env.ps1

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Regenerate TypeScript types from Rust
        run: |
          New-Item -ItemType Directory -Force -Path "../dist" | Out-Null
          cargo test --lib --quiet
        working-directory: frontend/src-tauri

      - name: Build coverage-instrumented Tauri app
        run: npm run tauri build -- --no-bundle
        working-directory: frontend
        env:
          CI: true
          E2E_COVERAGE: 1

      - name: Install Tauri WebDriver
        run: |
          if (-not (Get-Command tauri-driver -ErrorAction SilentlyContinue)) {
            cargo install tauri-driver --locked
          }
          tauri-driver --help | Select-Object -First 5
        working-directory: frontend

      - name: Verify explicit E2E runtime
        run: |
          $required = @(
            "VP_PYTHON_EXECUTABLE",
            "VP_FFMPEG_PATH",
            "VP_FFPROBE_PATH",
            "VP_RIFE_MODEL_DIR"
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "$name must be explicitly configured for release E2E"
            }
          }

      - name: Generate shared E2E fixture
        run: node frontend/scripts/generate-e2e-fixture.mjs "${{ runner.temp }}\vp-e2e-test.mp4"

      - name: Run complete WebDriverIO E2E suite
        timeout-minutes: 15
        run: npm run e2e
        working-directory: frontend
        env:
          E2E_COVERAGE: 1
          VP_TAURI_EXE_PATH: D:\ci-cache\cargo-target\release\vp-workbench.exe
          VP_E2E_INPUT: ${{ runner.temp }}\vp-e2e-test.mp4
          VP_E2E_OUTPUT_DIR: ${{ runner.temp }}\vp-e2e-output
          VP_BACKEND_DIR: ${{ github.workspace }}\backend

      - name: Generate E2E coverage report
        run: |
          $coverageFiles = @(Get-ChildItem -LiteralPath .nyc_output -Filter *.json -File -ErrorAction SilentlyContinue)
          if ($coverageFiles.Count -eq 0) {
            throw "E2E coverage data was not written to frontend/.nyc_output"
          }
          if ($coverageFiles.Count -gt 10) {
            throw "Expected at most 10 session coverage files, found $($coverageFiles.Count)"
          }
          npx nyc report --reporter=text --reporter=html
        working-directory: frontend
