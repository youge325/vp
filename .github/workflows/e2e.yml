name: End-to-End Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/app/**'
      - 'frontend/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'backend/app/**'
      - 'frontend/**'
      - '.github/workflows/e2e.yml'

jobs:
  e2e-smoke:
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: Setup CI runtime environment
        run: ./scripts/setup-ci-runtime-env.ps1

      - name: Generate synthetic test video
        run: |
          ffmpeg -f lavfi -i testsrc=duration=1:size=1280x720:rate=30 `
                 -f lavfi -i sine=frequency=1000:duration=1 `
                 -pix_fmt yuv420p -c:v libx264 -c:a aac `
                 "${{ runner.temp }}\vp-e2e-test.mp4" -y

      - name: Run CLI e2e smoke tests
        run: python -m pytest backend/tests/test_integration/test_cli_process_e2e.py -v
        env:
          VP_E2E_INPUT: ${{ runner.temp }}\vp-e2e-test.mp4
          VP_E2E_OUTPUT_DIR: ${{ runner.temp }}\vp-e2e-output

  e2e-ui:
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: Cache Cargo build artifacts
        uses: actions/cache@v4
        with:
          path: |
            frontend/src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache Vite build cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-vite-

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Regenerate TypeScript types from Rust (ts-rs)
        run: |
          New-Item -ItemType Directory -Force -Path "../dist" | Out-Null
          cargo test --lib --quiet
        working-directory: frontend/src-tauri

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: frontend

      - name: Generate synthetic test video
        run: |
          ffmpeg -f lavfi -i testsrc=duration=1:size=1280x720:rate=30 `
                 -f lavfi -i sine=frequency=1000:duration=1 `
                 -pix_fmt yuv420p -c:v libx264 -c:a aac `
                 "${{ runner.temp }}\vp-e2e-test.mp4" -y

      - name: Build Tauri app (release)
        run: npm run tauri build -- --no-bundle
        working-directory: frontend
        env:
          CI: true

      - name: Run Playwright e2e tests
        run: npx playwright test e2e/ --reporter=list
        working-directory: frontend
        env:
          VP_E2E_INPUT: ${{ runner.temp }}\vp-e2e-test.mp4
          VP_E2E_OUTPUT_DIR: ${{ runner.temp }}\vp-e2e-output
          VP_BACKEND_DIR: ${{ github.workspace }}\backend
          VP_FFMPEG_PATH: D:\ffmpeg-2025-08-11-git-3542260376-full_build\bin\ffmpeg.exe
          VP_FFPROBE_PATH: D:\ffmpeg-2025-08-11-git-3542260376-full_build\bin\ffprobe.exe
          VP_RIFE_MODEL_DIR: D:\tmp\vp-e2e-models
