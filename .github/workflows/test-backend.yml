name: Windows Test Backend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - 'contracts/**'
      - 'scripts/**'
      - 'ruff.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/test-backend.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - 'contracts/**'
      - 'scripts/**'
      - 'ruff.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/test-backend.yml'

permissions:
  contents: read

jobs:
  test-backend:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    runs-on: [self-hosted, windows]
    env:
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup CI runtime environment
        run: ./scripts/setup-ci-runtime-env.ps1

      - name: Run PyTorch backend tests with coverage
        run: python -m pytest -q --cov=app --cov-report=term
        working-directory: backend
        env:
          VP_TEST_BACKEND: pytorch

      - name: Run Paddle backend tests with coverage
        run: python -m pytest -q --cov=app --cov-report=term
        working-directory: backend
        env:
          VP_TEST_BACKEND: paddle
