name: Build ARC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '!frontend/e2e/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-arc.yml'
      - 'infra/arc/**'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '!frontend/e2e/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-arc.yml'
      - 'infra/arc/**'

permissions:
  contents: read

jobs:
  build-linux-arc:
    runs-on: vp-linux-arc
    env:
      CARGO_TARGET_DIR: /tmp/vp-cargo-target
      VP_FFMPEG_PATH: /usr/bin/ffmpeg
      VP_FFPROBE_PATH: /usr/bin/ffprobe
      VP_RIFE_MODEL_DIR: /opt/vp/models
      VP_PYTHON_EXECUTABLE: /opt/vp/venv/bin/python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify ARC runtime
        run: |
          node --version
          npm --version
          python --version
          rustc --version
          cargo --version
          ffmpeg -version | head -n 1

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Generate TypeScript types from Rust
        run: |
          mkdir -p ../dist
          cargo test --lib
        working-directory: frontend/src-tauri

      - name: Build Linux Tauri app (no bundle)
        run: npm run tauri build -- --no-bundle
        working-directory: frontend
        env:
          CI: true

      - name: Verify Linux build
        run: |
          binary="$CARGO_TARGET_DIR/release/vp-workbench"
          test -x "$binary"
          ls -lh "$binary"
