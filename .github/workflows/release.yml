name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release-windows:
    runs-on: [self-hosted, windows]
    env:
      HTTP_PROXY: http://127.0.0.1:7897
      HTTPS_PROXY: http://127.0.0.1:7897
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify environment
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Setup CI runtime environment
        run: ./scripts/setup-ci-runtime-env.ps1

      - name: Prepare bundled Windows runtime
        run: ./scripts/prepare-windows-runtime.ps1 -SkipPython

      - name: Build Tauri App (no installer)
        run: npm run tauri build -- --no-bundle
        working-directory: frontend
        env:
          CI: true
          HTTP_PROXY: http://127.0.0.1:7897
          HTTPS_PROXY: http://127.0.0.1:7897

      - name: Install 7-Zip
        run: |
          if (-not (Get-Command "7z.exe" -ErrorAction SilentlyContinue)) {
            Write-Host "Installing 7-Zip via Chocolatey..."
            choco install 7zip --yes --no-progress
            $env:PATH = "$env:PATH;C:\Program Files\7-Zip"
          } else {
            Write-Host "7-Zip already installed."
          }

      - name: Assemble portable package
        id: assemble
        run: |
          $ErrorActionPreference = "Stop"

          $releaseDir = "frontend/src-tauri/target/release"
          $staging = "$releaseDir/portable"
          $exeSource = "$releaseDir/vp-workbench.exe"

          # Verify executable exists
          if (-not (Test-Path -LiteralPath $exeSource -PathType Leaf)) {
            throw "Executable not found: $exeSource"
          }
          Write-Host "Executable found: $exeSource ($(Get-Item $exeSource).Length bytes)"

          # Clean and recreate staging directory
          if (Test-Path -LiteralPath $staging) {
            Remove-Item -LiteralPath $staging -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          # Copy executable
          Copy-Item -LiteralPath $exeSource -Destination "$staging/VP-Workbench.exe" -Force
          Write-Host "Copied executable"

          # Copy backend code
          if (Test-Path -LiteralPath "backend/app" -PathType Container) {
            New-Item -ItemType Directory -Force -Path "$staging/backend" | Out-Null
            Copy-Item -Recurse -LiteralPath "backend/app" -Destination "$staging/backend/app"
            Write-Host "Copied backend/app"
          }
          if (Test-Path -LiteralPath "backend/requirements.txt" -PathType Leaf) {
            Copy-Item -LiteralPath "backend/requirements.txt" -Destination "$staging/requirements.txt" -Force
            Write-Host "Copied requirements.txt"
          }

          # Copy prepared runtime resources (python/ffmpeg/models)
          if (Test-Path -LiteralPath "frontend/src-tauri/resources" -PathType Container) {
            Copy-Item -Recurse -LiteralPath "frontend/src-tauri/resources" -Destination "$staging/resources"
            $resourceSize = (Get-ChildItem "$staging/resources" -Recurse -File | Measure-Object -Property Length -Sum).Sum
            if ($resourceSize -ge 1GB) { $rSizeStr = "{0:N2} GB" -f ($resourceSize / 1GB) } elseif ($resourceSize -ge 1MB) { $rSizeStr = "{0:N1} MB" -f ($resourceSize / 1MB) } else { $rSizeStr = "$resourceSize bytes" }
            Write-Host "Copied resources: $rSizeStr"
          }

          # Compute total staging size
          $totalSize = (Get-ChildItem $staging -Recurse -File | Measure-Object -Property Length -Sum).Sum
          if ($totalSize -ge 1GB) { $tSizeStr = "{0:N2} GB" -f ($totalSize / 1GB) } elseif ($totalSize -ge 1MB) { $tSizeStr = "{0:N1} MB" -f ($totalSize / 1MB) } else { $tSizeStr = "$totalSize bytes" }
          Write-Host "Total staging size: $tSizeStr"

          # Create split zip using 7-Zip (each volume < 2GB for GitHub Release limit)
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          $zipBaseName = "VP-Workbench-${version}-windows-x64"
          $zipPath = "$releaseDir/$zipBaseName.zip"

          Write-Host "Creating split zip: $zipPath (max 1900MB per volume)..."
          # -v1900m = split into 1900MB volumes
          # -tzip = zip format (compatible with Windows Explorer)
          # Working dir must be staging so archive root matches expected layout
          & 7z.exe a -v1900m -tzip "$zipPath" "$staging\*"
          if ($LASTEXITCODE -ne 0) {
            throw "7z.exe failed to create split zip (exit code $LASTEXITCODE)"
          }

          $parts = Get-ChildItem -Path "$releaseDir" -Filter "$zipBaseName.zip.*" | Sort-Object Name
          Write-Host "Created $($parts.Count) volume(s):"
          foreach ($part in $parts) {
            if ($part.Length -ge 1MB) { $pSizeStr = "{0:N1} MB" -f ($part.Length / 1MB) } else { $pSizeStr = "$($part.Length) bytes" }
            Write-Host "  $($part.Name) ($pSizeStr)"
          }

          # Output for subsequent steps
          Add-Content -Path $env:GITHUB_OUTPUT -Value "zip_base_name=$zipBaseName"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "release_dir=$releaseDir"

      - name: Verify volumes exist
        run: |
          $baseName = "${{ steps.assemble.outputs.zip_base_name }}"
          $releaseDir = "${{ steps.assemble.outputs.release_dir }}"
          $parts = Get-ChildItem -Path "$releaseDir" -Filter "$baseName.zip.*"
          if ($parts.Count -eq 0) {
            throw "No zip volumes found for $baseName"
          }
          Write-Host "Verified $($parts.Count) volume(s) ready for upload"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.assemble.outputs.release_dir }}/${{ steps.assemble.outputs.zip_base_name }}.zip.*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
