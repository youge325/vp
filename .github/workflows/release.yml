name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release-windows:
    runs-on: [self-hosted, windows]
    env:
      HTTP_PROXY: http://127.0.0.1:7897
      HTTPS_PROXY: http://127.0.0.1:7897
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify environment
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Setup CI runtime environment
        run: ./scripts/setup-ci-runtime-env.ps1

      - name: Prepare bundled Windows runtime
        run: ./scripts/prepare-windows-runtime.ps1

      - name: Swap in NSISBI compiler for >2GB payload support
        run: ./scripts/install-nsisbi.ps1

      - name: Build Tauri App
        run: npm run tauri build
        working-directory: frontend
        env:
          CI: true
          HTTP_PROXY: http://127.0.0.1:7897
          HTTPS_PROXY: http://127.0.0.1:7897

      - name: Restore standard NSIS compiler
        if: always()
        run: ./scripts/install-nsisbi.ps1 -Restore

      - name: Collect bundle outputs
        id: collect
        run: |
          $msi = Get-ChildItem -Path "frontend/src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          $nsis = Get-ChildItem -Path "frontend/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) { Write-Output "msi_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT }
          if ($nsis) { Write-Output "nsis_path=$($nsis.FullName)" >> $env:GITHUB_OUTPUT }

      - name: Upload MSI artifact
        if: steps.collect.outputs.msi_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: ${{ steps.collect.outputs.msi_path }}

      - name: Upload NSIS artifact
        if: steps.collect.outputs.nsis_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: ${{ steps.collect.outputs.nsis_path }}

      - name: Upload to GitHub Release
        if: steps.collect.outputs.msi_path != '' || steps.collect.outputs.nsis_path != ''
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.collect.outputs.msi_path }}
            ${{ steps.collect.outputs.nsis_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
