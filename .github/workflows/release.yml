name: Windows Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release-windows:
    runs-on: [self-hosted, windows]
    permissions:
      contents: write
    env:
      HTTP_PROXY: http://127.0.0.1:7897
      HTTPS_PROXY: http://127.0.0.1:7897
      CARGO_TARGET_DIR: D:\ci-cache\cargo-target
      CARGO_HOME: D:\ci-cache\cargo-home
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify environment
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Install frontend dependencies (with Vite cache restore)
        run: |
          $viteCache = "node_modules/.vite"
          $localViteCache = "D:/ci-cache/vite-cache"
          if (Test-Path $viteCache) {
            New-Item -ItemType Directory -Force -Path $localViteCache | Out-Null
            robocopy $viteCache $localViteCache /MIR /R:1 /W:1 /MT:8 | Out-Null
          }
          npm ci
          if (Test-Path $localViteCache) {
            New-Item -ItemType Directory -Force -Path $viteCache | Out-Null
            robocopy $localViteCache $viteCache /MIR /R:1 /W:1 /MT:8 | Out-Null
          }
        working-directory: frontend

      - name: Setup CI runtime environment
        run: ./scripts/setup-ci-runtime-env.ps1

      - name: Prepare bundled Windows runtime
        run: ./scripts/prepare-windows-runtime.ps1 -SkipPython

      - name: Build Tauri App (no installer)
        run: npm run tauri build -- --no-bundle
        working-directory: frontend
        env:
          CI: true
          HTTP_PROXY: http://127.0.0.1:7897
          HTTPS_PROXY: http://127.0.0.1:7897

      - name: Assemble portable package
        id: assemble
        run: |
          $ErrorActionPreference = "Stop"

          $releaseDir = "$env:CARGO_TARGET_DIR/release"
          $staging = "$releaseDir/portable"
          $exeSource = "$releaseDir/vp-workbench.exe"

          # Verify executable exists
          if (-not (Test-Path -LiteralPath $exeSource -PathType Leaf)) {
            throw "Executable not found: $exeSource"
          }
          Write-Host "Executable found: $exeSource ($(Get-Item $exeSource).Length bytes)"

          # Clean and recreate staging directory
          if (Test-Path -LiteralPath $staging) {
            Remove-Item -LiteralPath $staging -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          # Copy executable
          Copy-Item -LiteralPath $exeSource -Destination "$staging/VP-Workbench.exe" -Force
          Write-Host "Copied executable"

          # Copy backend code
          if (Test-Path -LiteralPath "backend/app" -PathType Container) {
            New-Item -ItemType Directory -Force -Path "$staging/backend" | Out-Null
            Copy-Item -Recurse -LiteralPath "backend/app" -Destination "$staging/backend/app"
            Write-Host "Copied backend/app"
          }
          if (Test-Path -LiteralPath "backend/requirements.txt" -PathType Leaf) {
            Copy-Item -LiteralPath "backend/requirements.txt" -Destination "$staging/requirements.txt" -Force
            Write-Host "Copied requirements.txt"
          }

          # Copy prepared runtime resources (python/ffmpeg/models)
          if (Test-Path -LiteralPath "frontend/src-tauri/resources" -PathType Container) {
            Copy-Item -Recurse -LiteralPath "frontend/src-tauri/resources" -Destination "$staging/resources"
            $resourceSize = (Get-ChildItem "$staging/resources" -Recurse -File | Measure-Object -Property Length -Sum).Sum
            if ($resourceSize -ge 1GB) { $rSizeStr = "{0:N2} GB" -f ($resourceSize / 1GB) } elseif ($resourceSize -ge 1MB) { $rSizeStr = "{0:N1} MB" -f ($resourceSize / 1MB) } else { $rSizeStr = "$resourceSize bytes" }
            Write-Host "Copied resources: $rSizeStr"
          }

          # Compute total staging size
          $totalSize = (Get-ChildItem $staging -Recurse -File | Measure-Object -Property Length -Sum).Sum
          if ($totalSize -ge 1GB) { $tSizeStr = "{0:N2} GB" -f ($totalSize / 1GB) } elseif ($totalSize -ge 1MB) { $tSizeStr = "{0:N1} MB" -f ($totalSize / 1MB) } else { $tSizeStr = "$totalSize bytes" }
          Write-Host "Total staging size: $tSizeStr"

          # Create zip using tar.exe so the release path has no 7zip dependency.
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          $zipBaseName = "VP-Workbench-${version}-windows-x64"
          $zipPath = "$releaseDir/$zipBaseName.zip"

          Write-Host "Creating zip: $zipPath ..."
          # Use tar.exe with -a (auto-detect format from extension), -C to change into staging dir
          # so zip root contains files directly without "portable/" prefix
          & tar.exe -acf "$zipPath" -C "$staging" .
          if ($LASTEXITCODE -ne 0) {
            throw "tar.exe failed to create zip (exit code $LASTEXITCODE)"
          }

          $zipSize = (Get-Item -LiteralPath "$zipPath").Length
          if ($zipSize -ge 1GB) { $zSizeStr = "{0:N2} GB" -f ($zipSize / 1GB) } elseif ($zipSize -ge 1MB) { $zSizeStr = "{0:N1} MB" -f ($zipSize / 1MB) } else { $zSizeStr = "$zipSize bytes" }
          Write-Host "Zip created: $zipPath ($zSizeStr)"

          # Output for subsequent steps
          Add-Content -Path $env:GITHUB_OUTPUT -Value "zip_base_name=$zipBaseName"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "release_dir=$releaseDir"

      - name: Verify assembly
        run: |
          $zipPath = "${{ steps.assemble.outputs.release_dir }}/${{ steps.assemble.outputs.zip_base_name }}.zip"
          if (-not (Test-Path -LiteralPath "$zipPath" -PathType Leaf)) {
            throw "Assembled zip not found at: $zipPath"
          }
          $size = (Get-Item -LiteralPath "$zipPath").Length
          if ($size -ge 1GB) { $vSizeStr = "{0:N2} GB" -f ($size / 1GB) } elseif ($size -ge 1MB) { $vSizeStr = "{0:N1} MB" -f ($size / 1MB) } else { $vSizeStr = "$size bytes" }
          Write-Host "Build verified: $zipPath ($vSizeStr)"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.assemble.outputs.release_dir }}/${{ steps.assemble.outputs.zip_base_name }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
