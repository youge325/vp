name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release-windows:
    runs-on: [self-hosted, windows]
    env:
      HTTP_PROXY: http://127.0.0.1:7897
      HTTPS_PROXY: http://127.0.0.1:7897
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify environment
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Setup CI runtime environment
        run: ./scripts/setup-ci-runtime-env.ps1

      - name: Prepare bundled Windows runtime
        run: ./scripts/prepare-windows-runtime.ps1

      - name: Build Tauri App (no installer)
        run: npm run tauri build -- --no-bundle
        working-directory: frontend
        env:
          CI: true
          HTTP_PROXY: http://127.0.0.1:7897
          HTTPS_PROXY: http://127.0.0.1:7897

      - name: Assemble portable package
        run: |
          $staging = "frontend/src-tauri/target/release/portable"
          $exeSource = "frontend/src-tauri/target/release/vp-workbench.exe"

          # Clean and recreate staging directory
          if (Test-Path $staging) { Remove-Item -LiteralPath $staging -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          # Copy executable
          Copy-Item -LiteralPath $exeSource -Destination $staging/VP-Workbench.exe -Force

          # Copy backend code
          Copy-Item -Recurse -LiteralPath backend/app -Destination $staging/backend/app
          Copy-Item -LiteralPath backend/requirements.txt -Destination $staging/requirements.txt

          # Copy prepared runtime resources (python/ffmpeg/models)
          Copy-Item -Recurse -LiteralPath frontend/src-tauri/resources -Destination $staging/resources

          # Compress to zip
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          $zipName = "VP-Workbench-${version}-windows-x64.zip"
          Compress-Archive -Path "$staging/*" -DestinationPath "frontend/src-tauri/target/release/$zipName" -Force

          Write-Output "zip_path=frontend/src-tauri/target/release/$zipName" >> $env:GITHUB_OUTPUT
          Write-Output "zip_name=$zipName" >> $env:GITHUB_OUTPUT
        id: assemble

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: frontend/src-tauri/target/release/${{ steps.assemble.outputs.zip_name }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/src-tauri/target/release/${{ steps.assemble.outputs.zip_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
