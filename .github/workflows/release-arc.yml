name: Linux Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-linux-build-arc:
    runs-on: vp-linux-arc
    env:
      CARGO_TARGET_DIR: /tmp/vp-cargo-target
      VP_FFMPEG_PATH: /usr/bin/ffmpeg
      VP_FFPROBE_PATH: /usr/bin/ffprobe
      VP_RIFE_MODEL_DIR: /opt/vp/models
      VP_PYTHON_EXECUTABLE: /opt/vp/venv/bin/python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify ARC runtime
        run: |
          node --version
          npm --version
          python --version
          rustc --version
          cargo --version
          ffmpeg -version | head -n 1

      - name: Install frontend dependencies
        run: |
          npm ci
          npm install --include=optional --no-audit --no-fund
        working-directory: frontend

      - name: Regenerate TypeScript types from Rust (ts-rs)
        run: |
          mkdir -p ../dist
          cargo test --lib --quiet
        working-directory: frontend/src-tauri

      - name: Build Linux Tauri app (release verification only)
        run: npm run tauri build -- --no-bundle
        working-directory: frontend
        env:
          CI: true

      - name: Verify Linux release build
        run: |
          version="${GITHUB_REF_NAME#v}"
          binary="$CARGO_TARGET_DIR/release/vp-workbench"
          test -x "$binary"
          echo "Linux ARC release-build verification passed for $version"
          ls -lh "$binary"
