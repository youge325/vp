name: Test Backend ARC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/test-backend.yml'
      - '.github/workflows/test-backend-arc.yml'
      - 'infra/arc/**'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/test-backend.yml'
      - '.github/workflows/test-backend-arc.yml'
      - 'infra/arc/**'

permissions:
  contents: read

jobs:
  test-backend-pytorch-arc:
    runs-on: vp-linux-arc-pytorch
    env:
      PYTHONIOENCODING: utf-8
      VP_TEST_BACKEND: pytorch
      VP_FFMPEG_PATH: /usr/bin/ffmpeg
      VP_FFPROBE_PATH: /usr/bin/ffprobe
      VP_RIFE_MODEL_DIR: /opt/vp/models
      VP_PYTHON_EXECUTABLE: /opt/vp/venv/bin/python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify ARC runtime
        run: |
          python --version
          python -m pip --version
          ffmpeg -version | head -n 1
          test -d "$VP_RIFE_MODEL_DIR"

      - name: Run PyTorch backend tests with coverage
        run: python -m pytest -q --cov=app --cov-report=term
        working-directory: backend

  test-backend-paddle-arc:
    runs-on: vp-linux-arc-paddle
    env:
      PYTHONIOENCODING: utf-8
      VP_TEST_BACKEND: paddle
      VP_FFMPEG_PATH: /usr/bin/ffmpeg
      VP_FFPROBE_PATH: /usr/bin/ffprobe
      VP_RIFE_MODEL_DIR: /opt/vp/models
      VP_PYTHON_EXECUTABLE: /opt/vp/venv/bin/python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify ARC runtime
        run: |
          python --version
          python -m pip --version
          ffmpeg -version | head -n 1
          test -d "$VP_RIFE_MODEL_DIR"

      - name: Run Paddle backend tests with coverage
        run: python -m pytest -m paddle -q --cov=app --cov-report=term
        working-directory: backend
