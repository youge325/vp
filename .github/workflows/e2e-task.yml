name: End-to-End Task Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/app/**'
      - 'frontend/**'
      - '.github/workflows/e2e-task.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'backend/app/**'
      - 'frontend/**'
      - '.github/workflows/e2e-task.yml'

permissions:
  contents: read

jobs:
  build-e2e-task-app-windows:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TARGET_DIR: D:\ci-cache\cargo-target
      CARGO_HOME: D:\ci-cache\cargo-home
    steps:
      - uses: actions/checkout@v6

      - name: Install frontend dependencies (with Vite cache restore)
        run: |
          $viteCache = "node_modules/.vite"
          $localViteCache = "D:/ci-cache/vite-cache"
          if (Test-Path $viteCache) {
            New-Item -ItemType Directory -Force -Path $localViteCache | Out-Null
            robocopy $viteCache $localViteCache /MIR /R:1 /W:1 /MT:8 | Out-Null
          }
          npm ci
          if (Test-Path $localViteCache) {
            New-Item -ItemType Directory -Force -Path $viteCache | Out-Null
            robocopy $localViteCache $viteCache /MIR /R:1 /W:1 /MT:8 | Out-Null
          }
        working-directory: frontend

      - name: Regenerate TypeScript types from Rust (ts-rs)
        run: |
          New-Item -ItemType Directory -Force -Path "../dist" | Out-Null
          cargo test --lib --quiet
        working-directory: frontend/src-tauri

      - name: Build Tauri app (release)
        run: npm run tauri build -- --no-bundle
        working-directory: frontend
        env:
          CI: true
          E2E_COVERAGE: 1

      - name: Upload E2E task app artifact
        uses: actions/upload-artifact@v4
        with:
          name: vp-e2e-task-app-windows
          path: ${{ env.CARGO_TARGET_DIR }}\release\vp-workbench.exe
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  e2e-task-ui-windows:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    runs-on: [self-hosted, windows]
    needs: build-e2e-task-app-windows
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: Install frontend dependencies (with Vite cache restore)
        run: |
          $viteCache = "node_modules/.vite"
          $localViteCache = "D:/ci-cache/vite-cache"
          if (Test-Path $viteCache) {
            New-Item -ItemType Directory -Force -Path $localViteCache | Out-Null
            robocopy $viteCache $localViteCache /MIR /R:1 /W:1 /MT:8 | Out-Null
          }
          npm ci
          if (Test-Path $localViteCache) {
            New-Item -ItemType Directory -Force -Path $viteCache | Out-Null
            robocopy $localViteCache $viteCache /MIR /R:1 /W:1 /MT:8 | Out-Null
          }
        working-directory: frontend

      - name: Install Tauri WebDriver
        run: |
          if (-not (Get-Command tauri-driver -ErrorAction SilentlyContinue)) {
            cargo install tauri-driver --locked
          }
          tauri-driver --help | Select-Object -First 5
        working-directory: frontend

      - name: Download E2E task app artifact
        uses: actions/download-artifact@v4
        with:
          name: vp-e2e-task-app-windows
          path: ${{ runner.temp }}\vp-e2e-app

      - name: Verify E2E task app artifact
        run: |
          $app = "${{ runner.temp }}\vp-e2e-app\vp-workbench.exe"
          if (-not (Test-Path -LiteralPath $app -PathType Leaf)) {
            throw "E2E task app artifact not found: $app"
          }
          Write-Host "E2E task app artifact: $app ($(Get-Item -LiteralPath $app).Length bytes)"

      - name: Generate synthetic test video
        run: |
          ffmpeg -f lavfi -i testsrc=duration=1:size=1280x720:rate=30 `
                 -f lavfi -i sine=frequency=1000:duration=1 `
                 -pix_fmt yuv420p -c:v libx264 -c:a aac `
                 "${{ runner.temp }}\vp-e2e-test.mp4" -y

      - name: Run WebDriverIO task e2e tests
        timeout-minutes: 25
        run: npm run e2e
        working-directory: frontend
        env:
          VP_E2E_SPECS: './e2e/task/**/*.spec.ts'
          VP_TAURI_EXE_PATH: ${{ runner.temp }}\vp-e2e-app\vp-workbench.exe
          VP_E2E_INPUT: ${{ runner.temp }}\vp-e2e-test.mp4
          VP_E2E_OUTPUT_DIR: ${{ runner.temp }}\vp-e2e-output
          VP_BACKEND_DIR: ${{ github.workspace }}\backend
          VP_FFMPEG_PATH: D:\ffmpeg-2025-08-11-git-3542260376-full_build\bin\ffmpeg.exe
          VP_FFPROBE_PATH: D:\ffmpeg-2025-08-11-git-3542260376-full_build\bin\ffprobe.exe
          VP_RIFE_MODEL_DIR: D:\tmp\vp-e2e-models

      - name: Generate E2E coverage report (nyc)
        run: npx nyc report --reporter=text --reporter=html
        working-directory: frontend

  build-e2e-task-app-arc:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    runs-on: vp-linux-arc
    env:
      CARGO_TARGET_DIR: /tmp/vp-cargo-target
      PYTHONIOENCODING: utf-8
      VP_FFMPEG_PATH: /usr/bin/ffmpeg
      VP_FFPROBE_PATH: /usr/bin/ffprobe
      VP_RIFE_MODEL_DIR: /opt/vp/models
      VP_PYTHON_EXECUTABLE: /opt/vp/venv/bin/python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Regenerate TypeScript types from Rust (ts-rs)
        run: |
          mkdir -p ../dist
          cargo test --lib --quiet
        working-directory: frontend/src-tauri

      - name: Build Tauri app (release)
        run: npm run tauri build -- --no-bundle
        working-directory: frontend
        env:
          CI: true
          E2E_COVERAGE: 1

      - name: Upload E2E task app artifact
        uses: actions/upload-artifact@v4
        with:
          name: vp-e2e-task-app-linux-arc
          path: ${{ env.CARGO_TARGET_DIR }}/release/vp-workbench
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  e2e-task-ui-arc:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot' }}
    runs-on: vp-linux-arc
    needs: build-e2e-task-app-arc
    env:
      PYTHONIOENCODING: utf-8
      VP_FFMPEG_PATH: /usr/bin/ffmpeg
      VP_FFPROBE_PATH: /usr/bin/ffprobe
      VP_RIFE_MODEL_DIR: /opt/vp/models
      VP_PYTHON_EXECUTABLE: /opt/vp/venv/bin/python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Verify Tauri WebDriver runtime
        run: |
          tauri-driver --help | head -n 5
          if command -v WebKitWebDriver >/dev/null 2>&1; then
            WebKitWebDriver --version || WebKitWebDriver --help | head -n 5
          elif command -v webkit2gtk-driver >/dev/null 2>&1; then
            webkit2gtk-driver --version || webkit2gtk-driver --help | head -n 5
          else
            echo "WebKitGTK WebDriver binary was not found" >&2
            exit 1
          fi

      - name: Download E2E task app artifact
        uses: actions/download-artifact@v4
        with:
          name: vp-e2e-task-app-linux-arc
          path: ${{ runner.temp }}/vp-e2e-app

      - name: Verify E2E task app artifact
        run: |
          app="${RUNNER_TEMP}/vp-e2e-app/vp-workbench"
          chmod +x "$app"
          test -x "$app"
          ls -lh "$app"

      - name: Generate synthetic test video
        run: |
          ffmpeg -f lavfi -i testsrc=duration=1:size=1280x720:rate=30 \
                 -f lavfi -i sine=frequency=1000:duration=1 \
                 -pix_fmt yuv420p -c:v libx264 -c:a aac \
                 "${RUNNER_TEMP}/vp-e2e-test.mp4" -y

      - name: Run WebDriverIO task e2e tests
        timeout-minutes: 25
        run: xvfb-run -a npm run e2e
        working-directory: frontend
        env:
          VP_E2E_SPECS: './e2e/task/**/*.spec.ts'
          VP_TAURI_EXE_PATH: ${{ runner.temp }}/vp-e2e-app/vp-workbench
          VP_E2E_INPUT: ${{ runner.temp }}/vp-e2e-test.mp4
          VP_E2E_OUTPUT_DIR: ${{ runner.temp }}/vp-e2e-output
          VP_BACKEND_DIR: ${{ github.workspace }}/backend
          VP_RUNTIME_ROOT: ${{ github.workspace }}/frontend/src-tauri/resources/runtime

      - name: Generate E2E coverage report (nyc)
        run: npx nyc report --reporter=text --reporter=html
        working-directory: frontend
