name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-windows:
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Tauri App
        run: npm run tauri build
        working-directory: frontend
        env:
          CI: true

      - name: Collect bundle outputs
        id: collect
        run: |
          $msi = Get-ChildItem -Path "frontend/src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          $nsis = Get-ChildItem -Path "frontend/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) { Write-Output "msi_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT }
          if ($nsis) { Write-Output "nsis_path=$($nsis.FullName)" >> $env:GITHUB_OUTPUT }

      - name: Upload MSI artifact
        if: steps.collect.outputs.msi_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: ${{ steps.collect.outputs.msi_path }}

      - name: Upload NSIS artifact
        if: steps.collect.outputs.nsis_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: ${{ steps.collect.outputs.nsis_path }}
