[package]
name = "vp-workbench"
version = "0.1.0"
description = "Tauri workbench for video interpolation and delivery."
authors = ["OpenAI Codex"]
edition = "2021"

[lib]
name = "vp_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
command-group = { version = "5.0.1", features = ["with-tokio"] }
open = "5.3.2"
rfd = "0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.10.3", features = [] }
time = { version = "0.3.44", features = ["formatting"] }
tokio = { version = "1.48.0", features = ["io-util", "macros", "process", "rt-multi-thread", "sync"] }
