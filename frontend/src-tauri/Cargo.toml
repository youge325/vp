[package]
name = "vp-workbench"
version = "0.1.0"
description = "Tauri workbench for video interpolation and delivery."
authors = ["youge325"]
edition = "2021"
default-run = "vp-workbench"

[lib]
name = "vp_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
command-group = { version = "5.0.1", features = ["with-tokio"] }
chrono = { version = "0.4", features = ["serde"] }
open = "5.3.2"
rfd = "0.15.4"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
serde_json = "1"
tauri = { version = "2.11.1", features = [] }
tokio = { version = "1.48.0", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
typify = "0.7"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
libc = "0.2"

[[bin]]
name = "vp-workbench"
path = "src/main.rs"
